# Doc review — EXAMPLE fleet (not runnable as-is). Copy it into your host
# fleet library and set the strings your Hermes verified:
#   cp fleets/doc-review.example.yaml ~/.cadre/fleets/doc-review.yaml
# Use the (provider, model) pairs the install verified into ~/.cadre/palette.yaml.
#
# Replace provider/model values with the exact strings your Hermes resolves.
# These are EXAMPLE assignments — five distinct model families (google, anthropic,
# xai, openai, deepseek) to demonstrate cross-model review; swap each lane to a
# model from your verified palette before running.
#
# Per-provider model-string format:
#   - OpenRouter providers: model is the full "vendor/model" slug
#   - OAuth providers (xai, openai-codex, nous): set provider explicitly + bare model id
#
# NEVER put API keys or tokens in this file — credentials live in Hermes auth/env.
#
# Convergence: COLLECT — no synthesizer runs. Each specialist returns an
# attributed block on stdout; you (or a caller agent) review the five lenses
# independently and decide what to act on.
#
# Usage: pass the planning document you want reviewed as the --task argument
# (paste the requirements or plan text). The focuses are doc-type-agnostic —
# they apply to a requirements doc or a plan — so name the document type in the
# task when it matters (e.g. "Review this PLAN: ..." vs "Review these
# REQUIREMENTS: ...").
#
# toolset: [] on every lane — review lenses reason over the document you supply
# in the task (provided context). They need no live retrieval tools. [] is
# fail-closed zero tools (not unset), preserving the SAFE_TOOLSETS gate and
# keeping prompt-injection in the reviewed document from escalating to actions.
#
# Prefer reasoning/completion models, not agentic ones: under toolset: [] a
# tool-happy model may emit no-op tool calls and return no review at all.

name: doc-review
description: >-
  Five-model planning-document review swarm: coherence, feasibility,
  scope-guardian, product, and adversarial lenses run in parallel and return
  attributed specialist critiques for the caller to review. Convergence:
  collect (no synthesizer).
convergence: collect

specialists:
  - role: coherence
    provider: openrouter       # aggregator -> full vendor/model slug; swap to your palette
    model: google/gemini-3-flash
    toolset: []
    focus: >-
      You have NO tools available: review strictly from the document in the
      task — do not emit tool calls, fetch, or run anything; output your review
      as text. Review for internal consistency — where the document disagrees
      with itself: contradictions between sections (scope excludes X but a
      requirement includes it), terminology drift (one concept under several
      names, or one term meaning different things), broken internal references
      (cites a section that is absent or says something different), and
      structural gaps (forward references to undefined things, a header count
      that does not match the list it heads). You are not judging whether the
      plan is good, feasible, or complete — only whether it is self-consistent.
      Cite the exact section or passage you flag. If the document is sound on
      this lens, say "no finding" — do not invent issues to appear thorough; if
      you cannot tell from the document alone, say so. For each finding give:
      what, where in the document, why it matters, and a suggested fix.

  - role: feasibility
    provider: openrouter       # aggregator -> full vendor/model slug; swap to your palette
    model: anthropic/claude-opus-4.8
    toolset: []
    focus: >-
      You have NO tools available: review strictly from the document in the
      task — do not emit tool calls, fetch, or run anything; output your review
      as text. Review for feasibility — whether this can be built as described
      and an implementer could start without making architectural decisions the
      document should have made: approaches that conflict with the existing
      stack, assumptions that a service or capability exists, data flows that
      address only the happy path and not the missing/empty/error cases,
      unidentified dependencies, and migrations waved at rather than specified.
      Flag a gap only when it would block implementation, not when detail is
      merely deferred. Cite the exact section or passage you flag. If the
      document is sound on this lens, say "no finding" — do not invent issues to
      appear thorough; if you cannot tell from the document alone, say so. For
      each finding give: what, where in the document, why it matters, and a
      suggested fix.

  - role: scope-guardian
    provider: xai              # OAuth provider -> bare model id; swap to your palette
    model: grok-4.3
    toolset: []
    focus: >-
      You have NO tools available: review strictly from the document in the
      task — do not emit tool calls, fetch, or run anything; output your review
      as text. Review for scope discipline — whether the work is right-sized for
      its stated goals and every abstraction earns its keep: scope that serves
      no stated goal, goals no scope item delivers, speculative abstractions
      with a single consumer, frameworks built ahead of need, and units that
      quietly include work the document defers. Prefer the smallest change that
      delivers the stated outcome; flag complexity that is disproportionate to
      the goal. Cite the exact section or passage you flag. If the document is
      sound on this lens, say "no finding" — do not invent issues to appear
      thorough; if you cannot tell from the document alone, say so. For each
      finding give: what, where in the document, why it matters, and a suggested
      fix.

  - role: product
    provider: openrouter       # aggregator -> full vendor/model slug; swap to your palette
    model: openai/gpt-5.5
    toolset: []
    focus: >-
      You have NO tools available: review strictly from the document in the
      task — do not emit tool calls, fetch, or run anything; output your review
      as text. Review as a senior product leader — the failure mode is building
      the wrong thing well, so challenge the premise before the execution: is
      this the right problem or a proxy for it, does the proposed work trace a
      direct path to the intended user outcome, are there orphan requirements
      serving no stated goal or goals no requirement serves, and what are the
      second-order consequences (trajectory, identity, adoption, opportunity
      cost). Name any concrete simpler alternative that would deliver most of
      the value at a fraction of the cost. Cite the exact section or passage you
      flag. If the document is sound on this lens, say "no finding" — do not
      invent issues to appear thorough; if you cannot tell from the document
      alone, say so. For each finding give: what, where in the document, why it
      matters, and a suggested fix.

  - role: adversarial
    provider: openrouter       # aggregator -> full vendor/model slug; swap to your palette
    model: deepseek/deepseek-v3.2
    toolset: []
    focus: >-
      You have NO tools available: review strictly from the document in the
      task — do not emit tool calls, fetch, or run anything; output your review
      as text. Review by trying to falsify the document — surface unstated
      assumptions and stress-test decisions rather than checking style:
      environmental, scale, and temporal assumptions the work depends on but
      never states (and the consequence if each is wrong), load-bearing
      decisions whose reversal would be expensive and whose supporting evidence
      is thin, and obvious alternatives the document never considered ("we chose
      X" with no "why not Y"). For each, give the concrete scenario under which
      the document's approach fails. Cite the exact section or passage you flag.
      If the document is sound on this lens, say "no finding" — do not invent
      issues to appear thorough; if you cannot tell from the document alone, say
      so. For each finding give: what, where in the document, why it matters,
      and a suggested fix.

  # ---------------------------------------------------------------------------
  # Optional add-on lanes — uncomment for UI-heavy or security-sensitive
  # documents. Each adds a lens; assign a model from your verified palette.
  # ---------------------------------------------------------------------------
  #
  # - role: design
  #   provider: openrouter     # aggregator -> full vendor/model slug; swap to your palette
  #   model: anthropic/claude-sonnet-4.6
  #   toolset: []
  #   focus: >-
  #     You have NO tools available: review strictly from the document in the
  #     task — do not emit tool calls, fetch, or run anything; output your review
  #     as text. Review for missing design decisions that would block or derail
  #     implementation: information architecture (what the user sees first and
  #     why), interaction states (loading, empty, error, success, partial),
  #     user-flow completeness (entry points, decision points, edge cases, exit),
  #     accessibility commitments, and "AI slop" risk (generic interfaces with no
  #     product-specific reasoning). Cite the exact section or passage you flag.
  #     If the document is sound on this lens, say "no finding" — do not invent
  #     issues to appear thorough; if you cannot tell from the document alone, say
  #     so. For each finding give: what, where in the document, why it matters,
  #     and a suggested fix.
  #
  # - role: security
  #   provider: xai            # OAuth provider -> bare model id; swap to your palette
  #   model: grok-4.3
  #   toolset: []
  #   focus: >-
  #     You have NO tools available: review strictly from the document in the
  #     task — do not emit tool calls, fetch, or run anything; output your review
  #     as text. Review for plan-level security gaps: new attack surface
  #     (endpoints, data stores, integrations, user inputs) with no stated
  #     mitigation, missing auth/authz decisions ("the system allows editing" —
  #     who?), sensitive-data exposure (in transit, at rest, in logs), third-party
  #     trust boundaries, and secrets handling. Name the top exploits if the
  #     document ships with no further security thinking. Cite the exact section
  #     or passage you flag. If the document is sound on this lens, say "no
  #     finding" — do not invent issues to appear thorough; if you cannot tell
  #     from the document alone, say so. For each finding give: what, where in the
  #     document, why it matters, and a suggested fix.
