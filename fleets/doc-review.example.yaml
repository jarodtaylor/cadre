# Doc review — EXAMPLE fleet (not runnable as-is). Copy it into your host
# fleet library and set the strings your Hermes verified:
#   cp fleets/doc-review.example.yaml ~/.cadre/fleets/doc-review.yaml
# Use the (provider, model) pairs the install verified into ~/.cadre/palette.yaml.
#
# Replace provider/model values with the exact strings your Hermes resolves.
# These are EXAMPLE assignments — five distinct model families (google, anthropic,
# xai, openai, deepseek) to demonstrate cross-model review; swap each lane to a
# model from your verified palette before running.
#
# Per-provider model-string format:
#   - OpenRouter providers: model is the full "vendor/model" slug
#   - OAuth providers (xai, openai-codex, nous): set provider explicitly + bare model id
#
# NEVER put API keys or tokens in this file — credentials live in Hermes auth/env.
#
# Convergence: COLLECT — no synthesizer runs. Each specialist returns an
# attributed block on stdout; you (or a caller agent) review the five lenses
# independently and decide what to act on.
#
# Usage: name the planning document with --doc PATH (repeatable) — the runner
# reads the file into the task, so you no longer paste its text:
#   run.py --fleet ~/.cadre/fleets/doc-review.yaml --doc plan.md --task "Review this PLAN"
# --preview lists the resolved --doc paths (and read-checks them — a missing or
# non-UTF-8 file fails before any model runs). The personas are doc-type-agnostic —
# they apply to a requirements doc or a plan — so name the document type in the
# task when it matters (e.g. --task "Review this PLAN" vs "Review these
# REQUIREMENTS"). Pasting the text into --task still works; --doc just removes the
# copy-paste.
#
# toolset: [] on every active lane — each specialist reasons over the document
# you supply (via --doc, or pasted into --task) as provided context only. [] is
# fail-closed zero tools (not unset), preserving the SAFE_TOOLSETS gate and keeping
# prompt-injection in the reviewed document from escalating to actions.
#
# Prefer reasoning/completion models, not agentic ones: under toolset: [] a
# tool-happy model may emit no-op tool calls and return no review at all.
#
# Active lanes use rich persona files from the shared personas/ pool — the full
# persona text (not a one-line focus) is what each lane runs. Persona files
# contain the lens's full instruction, grounding controls, and citation guidance.

name: doc-review
description: >-
  Five-model planning-document review swarm: coherence, feasibility,
  scope-guardian, product, and adversarial lenses run in parallel and return
  attributed specialist critiques for the caller to review. Convergence:
  collect (no synthesizer).
convergence: collect

specialists:
  - role: coherence
    provider: openrouter       # aggregator -> full vendor/model slug; swap to your palette
    model: google/gemini-3-flash
    toolset: []
    persona: coherence-reviewer

  - role: feasibility
    provider: openrouter       # aggregator -> full vendor/model slug; swap to your palette
    model: anthropic/claude-opus-4.8
    toolset: []
    persona: feasibility-reviewer

  - role: scope-guardian
    provider: xai              # OAuth provider -> bare model id; swap to your palette
    model: grok-4.3
    toolset: []
    persona: scope-guardian-reviewer

  - role: product
    provider: openrouter       # aggregator -> full vendor/model slug; swap to your palette
    # Cost-efficiency comparison lane: swap this to a cheaper/smaller model on your palette
    # (e.g. anthropic/claude-haiku-4-5) to compare rich-persona output vs. the old
    # compressed focus at a fixed cost point — the host dogfood controlled comparison.
    model: openai/gpt-5.5
    toolset: []
    persona: product-reviewer

  - role: adversarial
    provider: openrouter       # aggregator -> full vendor/model slug; swap to your palette
    model: deepseek/deepseek-v3.2
    toolset: []
    persona: adversarial-document-reviewer

  # ---------------------------------------------------------------------------
  # Optional add-on lanes — uncomment for UI-heavy or security-sensitive
  # documents. Each adds a lens; assign a model from your verified palette.
  # These lanes retain inline focus: (no persona files exist for design/security
  # yet); replace with persona: references once those files are authored.
  # ---------------------------------------------------------------------------
  #
  # - role: design
  #   provider: openrouter     # aggregator -> full vendor/model slug; swap to your palette
  #   model: anthropic/claude-sonnet-4.6
  #   toolset: []
  #   focus: >-
  #     You have NO tools available: review strictly from the document in the
  #     task — do not emit tool calls, fetch, or run anything; output your review
  #     as text. Review for missing design decisions that would block or derail
  #     implementation: information architecture (what the user sees first and
  #     why), interaction states (loading, empty, error, success, partial),
  #     user-flow completeness (entry points, decision points, edge cases, exit),
  #     accessibility commitments, and "AI slop" risk (generic interfaces with no
  #     product-specific reasoning). Cite the exact section or passage you flag.
  #     If the document is sound on this lens, say "no finding" — do not invent
  #     issues to appear thorough; if you cannot tell from the document alone, say
  #     so. For each finding give: what, where in the document, why it matters,
  #     and a suggested fix.
  #
  # - role: security
  #   provider: xai            # OAuth provider -> bare model id; swap to your palette
  #   model: grok-4.3
  #   toolset: []
  #   focus: >-
  #     You have NO tools available: review strictly from the document in the
  #     task — do not emit tool calls, fetch, or run anything; output your review
  #     as text. Review for plan-level security gaps: new attack surface
  #     (endpoints, data stores, integrations, user inputs) with no stated
  #     mitigation, missing auth/authz decisions ("the system allows editing" —
  #     who?), sensitive-data exposure (in transit, at rest, in logs), third-party
  #     trust boundaries, and secrets handling. Name the top exploits if the
  #     document ships with no further security thinking. Cite the exact section
  #     or passage you flag. If the document is sound on this lens, say "no
  #     finding" — do not invent issues to appear thorough; if you cannot tell
  #     from the document alone, say so. For each finding give: what, where in the
  #     document, why it matters, and a suggested fix.
